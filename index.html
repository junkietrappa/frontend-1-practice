<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Выбор даты и времени</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="page-header">
        <div class="brand-block">
          <div class="brand-mark">B</div>
          <div class="brand-text">
            <span class="brand-name">Barber House</span>
            <span class="brand-subtitle">Студия мужской красоты</span>
          </div>
        </div>
        <button class="header-button" type="button">Назад</button>
      </header>

      <main class="booking-page">
        <aside class="booking-summary">
          <p class="summary-label">Запись</p>
          <h1>Выбор даты и времени</h1>

          <div class="summary-card">
            <div class="service-row">
              <span class="service-name">Классический стрижка</span>
              <span class="service-price">2 200 ₽</span>
            </div>
            <div class="service-meta">
              <span>45 минут</span>
              <span>Барбер</span>
            </div>
          </div>

          <div class="summary-list">
            <div class="summary-item">
              <span class="summary-name">Мастер</span>
              <span class="summary-value">Александр</span>
            </div>
            <div class="summary-item">
              <span class="summary-name">Дата</span>
              <span class="summary-value">Пятница, 15 мая</span>
            </div>
            <div class="summary-item">
              <span class="summary-name">Время</span>
              <span class="summary-value">11:30</span>
            </div>
          </div>
        </aside>

        <section class="booking-panel" aria-label="Выбор даты и времени">
          <div class="panel-top">
            <div>
              <p class="panel-label">Календарь</p>
              <h2>Выберите дату</h2>
            </div>
            <div class="month-switch">
              <button type="button" class="month-arrow" aria-label="Предыдущий месяц">‹</button>
              <span class="month-name">Май 2026</span>
              <button type="button" class="month-arrow" aria-label="Следующий месяц">›</button>
            </div>
          </div>

          <div class="calendar" aria-label="Календарь записи">
            <div class="weekdays">
              <span>Пн</span>
              <span>Вт</span>
              <span>Ср</span>
              <span>Чт</span>
              <span>Пт</span>
              <span>Сб</span>
              <span>Вс</span>
            </div>

            <div class="dates-grid">
              <button type="button" class="date-day muted">27</button>
              <button type="button" class="date-day muted">28</button>
              <button type="button" class="date-day muted">29</button>
              <button type="button" class="date-day muted">30</button>
              <button type="button" class="date-day">1</button>
              <button type="button" class="date-day">2</button>
              <button type="button" class="date-day">3</button>

              <button type="button" class="date-day">4</button>
              <button type="button" class="date-day">5</button>
              <button type="button" class="date-day">6</button>
              <button type="button" class="date-day">7</button>
              <button type="button" class="date-day">8</button>
              <button type="button" class="date-day">9</button>
              <button type="button" class="date-day">10</button>

              <button type="button" class="date-day">11</button>
              <button type="button" class="date-day">12</button>
              <button type="button" class="date-day">13</button>
              <button type="button" class="date-day active">14</button>
              <button type="button" class="date-day selected">15</button>
              <button type="button" class="date-day">16</button>
              <button type="button" class="date-day">17</button>

              <button type="button" class="date-day">18</button>
              <button type="button" class="date-day">19</button>
              <button type="button" class="date-day">20</button>
              <button type="button" class="date-day">21</button>
              <button type="button" class="date-day">22</button>
              <button type="button" class="date-day">23</button>
              <button type="button" class="date-day">24</button>

              <button type="button" class="date-day">25</button>
              <button type="button" class="date-day">26</button>
              <button type="button" class="date-day">27</button>
              <button type="button" class="date-day">28</button>
              <button type="button" class="date-day">29</button>
              <button type="button" class="date-day">30</button>
              <button type="button" class="date-day">31</button>
            </div>
          </div>

          <div class="slots-block">
            <div class="slots-header">
              <p class="panel-label">Свободное время</p>
              <span class="slots-note">Сегодня осталось 4 места</span>
            </div>

            <div class="slots-grid" aria-label="Слоты времени">
              <button type="button" class="slot slot-available">09:00</button>
              <button type="button" class="slot slot-available">09:45</button>
              <button type="button" class="slot slot-occupied">10:30</button>
              <button type="button" class="slot slot-available">11:15</button>
              <button type="button" class="slot slot-selected">11:30</button>
              <button type="button" class="slot slot-available">12:15</button>
              <button type="button" class="slot slot-occupied">13:00</button>
              <button type="button" class="slot slot-available">14:00</button>
              <button type="button" class="slot slot-available">15:15</button>
              <button type="button" class="slot slot-occupied">16:30</button>
              <button type="button" class="slot slot-available">17:00</button>
              <button type="button" class="slot slot-available">18:15</button>
            </div>
          </div>

          <footer class="booking-actions">
            <button type="button" class="secondary-button">Сбросить</button>
            <button type="button" class="primary-button">Продолжить</button>
          </footer>
        </section>
      </main>
    </div>
  </body>
</html>
